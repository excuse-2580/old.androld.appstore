:root{

  --md-radius:16px;
  --md-radius-sm:12px;
  --md-radius-pill:999px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  background:var(--md-surface-variant);
  color:var(--md-on-surface);
  font-family:"Roboto","WenQuanYi Micro Hei",-apple-system,sans-serif;
  margin:0;padding:0;
  line-height:1.5;
}
.top{
  background:var(--md-primary);
  padding:20px 16px 24px;
  color:var(--md-on-primary);
  box-shadow:var(--md-shadow-lg);
  position:sticky;top:0;z-index:100;
}
.top h2{
  margin:0 0 12px 0;
  font-size:22px;
  font-weight:700;
  letter-spacing:.3px;
}
#q{
  width:100%;
  padding:14px 18px;
  font-size:16px;
  box-sizing:border-box;
  border:none;
  border-radius:var(--md-radius-pill);
  background:rgba(255,255,255,.95);
  color:var(--md-on-surface);
  outline:none;
  box-shadow:var(--md-shadow);
  transition:box-shadow .2s;
}
#q:focus{box-shadow:0 0 0 3px rgba(26,127,55,.25);}
.cats{
  padding:12px 16px;
  overflow-x:auto;
  white-space:nowrap;
  -webkit-overflow-scrolling:touch;
  background:var(--md-surface);
  box-shadow:var(--md-shadow);
  position:sticky;top:0;z-index:99;
}
.cat{
  display:inline-flex;
  align-items:center;
  padding:8px 18px;
  background:var(--md-surface-variant);
  color:var(--md-on-surface-variant);
  margin-right:8px;
  border-radius:var(--md-radius-pill);
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  border:1.5px solid transparent;
  transition:all .18s ease;
  user-select:none;
}
.cat.active{
  background:var(--md-primary);
  color:var(--md-on-primary);
  border-color:var(--md-primary);
  box-shadow:var(--md-shadow);
}
.cat:active{transform:scale(.95);}
.list{padding:16px;}
.card{
  background:var(--md-surface);
  padding:16px;
  margin-bottom:14px;
  border-radius:var(--md-radius);
  box-shadow:var(--md-shadow);
  transition:box-shadow .2s;
}
.card:active{box-shadow:var(--md-shadow-lg);}
.card h3{
  margin:0 0 8px 0;
  font-size:17px;
  font-weight:600;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
}
.card p{
  margin:6px 0;
  font-size:14px;
  color:var(--md-on-surface-variant);
}
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  width:100%;
  box-sizing:border-box;
  background:var(--md-primary);
  color:var(--md-on-primary);
  text-align:center;
  padding:13px 0;
  border-radius:var(--md-radius-sm);
  text-decoration:none;
  font-size:15px;
  font-weight:600;
  margin-top:8px;
  transition:opacity .15s;
}
.btn:active{opacity:.75;}
.btn-blue{
  background:var(--md-surface-variant);
  color:var(--md-primary);
  border:1.5px solid var(--md-outline);
}
.btn-blue:active{background:#e0f2e8;}
.meta{font-size:12px;color:#888;margin-top:6px;}
.tag{
  display:inline-flex;
  align-items:center;
  padding:3px 10px;
  background:var(--md-primary-container);
  color:#065f1f;
  border-radius:var(--md-radius-pill);
  font-size:12px;
  font-weight:600;
}
.warn{
  background:#fef2f2;
  color:#b91c1c;
  padding:8px 12px;
  border-radius:var(--md-radius-sm);
  font-size:12px;
  margin-top:8px;
  border-left:4px solid #ef4444;
}
.pwd-text{color:#d93025;font-weight:700;font-size:14px;}
footer{
  padding:20px 16px 40px;
  background:var(--md-surface);
  margin-top:24px;
  font-size:13px;
  color:var(--md-on-surface-variant);
  border-top:1px solid var(--md-outline);
}
footer h3{margin-top:0;color:var(--md-on-surface);font-size:16px;}
footer p{margin:8px 0;}
</style>

var curCat = "全部";
var kindLabels = {"phone":"📱手机版","lite":"🪶轻聊版","watch":"⌚手表版","hd":"🧊HD版"};

function extractPwd(pwd){
  if(!pwd) return '';
  var m = pwd.match(/<span style=['"]display:none['"]>([^<]+)<\/span>/);
  return m ? m[1] : pwd;
}

function renderCats() {
  var cats = ["全部","资源站"];
  for (var i = 0; i < APPS.length; i++) {
    if (cats.indexOf(APPS[i].cat) === -1) {
      cats.push(APPS[i].cat);
    }
  }
  var html = "";
  for (var j = 0; j < cats.length; j++) {
    var active = (cats[j] === curCat) ? " active" : "";
    html += '<span class="cat' + active + '" onclick="setCat(\'' + cats[j] + '\')">' + cats[j] + '</span>';
  }
  document.getElementById("cats").innerHTML = html;
}

function setCat(c) {
  curCat = c;
  document.getElementById("q").value = "";
  render();
}

function render() {
  var q = document.getElementById("q").value.toLowerCase();
  var html = "";

  if (curCat === "资源站") {
    for (var i = 0; i < SITES.length; i++) {
      var s = SITES[i];
      if (q && s.name.toLowerCase().indexOf(q) === -1 && s.desc.toLowerCase().indexOf(q) === -1) continue;
      html += '<div class="card">'
        + '<h3>' + s.name + ' <span style="font-size:12px;color:var(--md-primary);font-weight:500;">[' + s.tag + ']</span></h3>'
        + '<p>' + s.desc + '</p>';
      if (s.pwd) html += '<p class="meta"><span class="pwd-text">密码：' + extractPwd(s.pwd) + '</span></p>';
      if (s.warn) html += '<p class="warn">' + s.warn + '</p>';
      html += '<p class="meta">最低：' + (typeof s.minSdk === "string" ? s.minSdk : "SDK "+s.minSdk) + '</p>'
        + '<a class="btn" href="' + s.url + '" target="_blank">打开站点</a>'
        + '</div>';
    }
    if (!html) html = '<div class="card" style="text-align:center;color:#888;">没找到相关站点<br><a href="https://valleysraised.mysxl.cn/" target="_blank" style="color:var(--md-primary);font-weight:600;">去旧卓通首页</a></div>';
    document.getElementById("list").innerHTML = html;
    return;
  }

  for (var i = 0; i < APPS.length; i++) {
    var a = APPS[i];
    if (curCat !== "全部" && a.cat !== curCat) continue;
    if (q && a.name.toLowerCase().indexOf(q) === -1 && a.desc.toLowerCase().indexOf(q) === -1) continue;

    html += '<div class="card">'
      + '<h3>' + a.name + ' <span class="tag">' + (kindLabels[a.kind]||a.kind) + '</span></h3>'
      + '<p>' + a.desc + '</p>'
      + '<p class="meta">版本：' + a.ver + ' | 最低：SDK ' + a.minSdk + '</p>';
    if (a.tested) html += '<p class="meta" style="color:#065f1f;font-weight:500;">✅ ' + a.tested + '</p>';
    if (a.warn) html += '<p class="warn">' + a.warn + '</p>';
    if (a.pwd) html += '<p class="meta"><span class="pwd-text">网盘密码：' + extractPwd(a.pwd) + '</span></p>';

    var btns = "";
    for (var s = 0; s < a.sources.length; s++) {
      var src = a.sources[s];
      var cls = src.primary ? "btn" : "btn btn-blue";
      btns += '<a class="' + cls + '" href="' + src.url + '" target="_blank" style="margin-bottom:6px;">' + src.label + '</a>';
    }
    html += '<div style="margin-top:8px;">' + btns + '</div></div>';
  }

  if (!html) {
    var searchUrl = "https://valleysraised.mysxl.cn/search?q=" + encodeURIComponent(q);
    html = '<div class="card" style="text-align:center;color:#888;">没找到相关应用<br><a href="' + searchUrl + '" target="_blank" style="color:var(--md-primary);font-weight:600;">去旧卓通搜索：' + q + '</a></div>';
  }
  document.getElementById("list").innerHTML = html;
}

renderCats();
render();
